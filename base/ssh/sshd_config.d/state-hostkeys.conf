# host key 放到 /run/router-vm/state/ssh（宿主启用 stateDisk 时持久，否则 tmpfs 易失）
#
# 不能靠 /etc/ssh/ssh_host_* 的符号链接：ssh-keygen 在目标同目录创建
# 临时文件（ssh_host_rsa_key.XXXXXXXXXX），ro rootfs 上必然失败
# （实测 "Could not save your private key ... Read-only file system"）。
# key 由 sshd-keys 服务按「不存在才生成」维护：持久盘（stateDisk）
# 存在则身份跨重启稳定，无盘则每次启动更换；deploy 通道用 root/root
# 密码 + StrictHostKeyChecking=no。
# 注：sshd_config 中一旦出现 HostKey 行，默认路径
# （/etc/ssh/ssh_host_*）即被整体替换，不会有双份 key。
HostKey /run/router-vm/state/ssh/ssh_host_rsa_key
HostKey /run/router-vm/state/ssh/ssh_host_ecdsa_key
HostKey /run/router-vm/state/ssh/ssh_host_ed25519_key
